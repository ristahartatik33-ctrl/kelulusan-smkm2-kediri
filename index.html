<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Kelulusan - SMK Muhammadiyah 2 Kediri</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: radial-gradient(circle at top, #0b1f3a, #050d1c); color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        header { 
            display: flex; align-items: center; padding: 10px 5%; 
            background: rgba(14, 34, 63, 0.9); backdrop-filter: blur(10px); 
            position: fixed; top: 0; width: 100%; z-index: 1000; border-bottom: 1px solid #1f3a63; 
        }
        
        .logo-sekolah { height: 55px; width: auto; margin-right: 15px; }
        
        .container { text-align: center; max-width: 600px; width: 100%; margin-top: 110px; }
        .badge { display: inline-block; background: #f5b800; color: #000; padding: 5px 15px; border-radius: 20px; font-size: 12px; margin-bottom: 20px; font-weight: bold; }
        h1 { font-size: 28px; margin-bottom: 5px; line-height: 1.2; }
        h1 span { color: #f5b800; }
        p { font-size: 14px; color: #aaa; margin-bottom: 25px; }

        .search-box { display: flex; background: #0e223f; border-radius: 10px; overflow: hidden; border: 1px solid #1f3a63; margin-bottom: 20px; }
        .search-box input { flex: 1; padding: 15px; border: none; outline: none; background: transparent; color: #fff; }
        .search-box button { background: #f5b800; border: none; padding: 12px 25px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .search-box button:disabled { background: #888; cursor: not-allowed; }

        #hasil-pencarian { margin-top: 20px; padding: 20px; border-radius: 10px; background: #162d50; display: none; border: 1px solid #f5b800; }
        
        .features { display: flex; justify-content: space-between; margin-top: 25px; gap: 10px; }
        .card { flex: 1; background: #0e223f; padding: 15px; border-radius: 10px; font-size: 11px; color: #ccc; border: 1px solid #1f3a63; }
        footer { margin-top: 30px; font-size: 11px; color: #666; }
    </style>
</head>
<body>

<audio id="suaraLulus" src="douten.mp3" preload="auto" loop></audio>

<header>
    <img src="logo%20smk%20muh%202%20HD.png" alt="Logo SMK" class="logo-sekolah">
    <div>
        <div style="font-weight: bold; font-size: 15px; color: #f5b800;">SMK MUHAMMADIYAH 2</div>
        <div style="font-size: 12px; color: #fff; letter-spacing: 1px;">KOTA KEDIRI</div>
    </div>
</header>

<div class="container">
    <div class="badge">PENGUMUMAN RESMI</div>
    <h1>Selamat Datang di Portal <br><span>Pengumuman Kelulusan</span></h1>
    <p>Masukkan nama lengkap Anda untuk mengecek status kelulusan.</p>

    <div class="search-box">
        <input type="text" id="inputNama" placeholder="Contoh: Arba Marina Juwita">
        <button onclick="cekStatus()">Cek Status</button>
    </div>

    <div id="hasil-pencarian">
        <h2 id="resNama" style="color: #f5b800; margin-bottom: 5px;"></h2>
        <p id="resKelas" style="margin-bottom: 15px; color: #fff; font-size: 16px;"></p>
        <div id="resStatus" style="font-size: 22px; font-weight: bold; padding: 15px; border-radius: 8px;"></div>
    </div>

    <div class="features">
        <div class="card"> Data Aman<br>Informasi terjaga</div>
        <div class="card"> Real-time<br>Hasil langsung</div>
        <div class="card"> Resmi<br>Data sekolah</div>
    </div>

    <footer>© 2026 SMK Muhammadiyah 2 Kediri.</footer>
</div>

<script>
    let intervalKonfeti; // Variabel global untuk menyimpan interval

    async function cekStatus() {
        const namaInput = document.getElementById('inputNama').value;
        const hasilDiv = document.getElementById('hasil-pencarian');
        const btn = document.querySelector('.search-box button');
        const audio = document.getElementById('suaraLulus');
        
        // URL API dari Google Apps Script Anda
        const urlAPI = "https://script.google.com/macros/s/AKfycby7p9pyBjAMzK4rsWnNNH3mBnTvhlqe8GWYQ8ofkaxceFq5_CoIrBJzvDNEOZ5DlR1rWw/exec"; 

        if(!namaInput) {
            alert("Harap masukkan nama lengkap!");
            return;
        }

        // Reset tampilan & hentikan selebrasi lama jika ada
        clearInterval(intervalKonfeti);
        audio.pause();
        audio.currentTime = 0;
        hasilDiv.style.display = "none";
        btn.innerText = "Mencari...";
        btn.disabled = true;
        
        try {
            const response = await fetch(`${urlAPI}?nama=${encodeURIComponent(namaInput)}`);
            const data = await response.json();

            hasilDiv.style.display = "block";
            
            if (data.status !== "Tidak Ditemukan") {
                document.getElementById('resNama').innerText = namaInput.toUpperCase();
                document.getElementById('resKelas').innerText = "Kelas: " + data.kelas;
                document.getElementById('resStatus').innerText = data.status;
                
                if(data.status.toUpperCase() === "LULUS") {
                    document.getElementById('resStatus').style.backgroundColor = "#28a745";
                    document.getElementById('resStatus').style.color = "#fff";
                    
                    // AKTIFKAN MUSIK & KONFETI LOOPING
                    audio.play().catch(e => console.log("Audio butuh klik user"));
                    loopingKonfeti();
                } else {
                    document.getElementById('resStatus').style.backgroundColor = "#dc3545";
                    document.getElementById('resStatus').style.color = "#fff";
                }
            } else {
                document.getElementById('resNama').innerText = "Data Tidak Ditemukan";
                document.getElementById('resStatus').innerText = "-";
                document.getElementById('resStatus').style.backgroundColor = "transparent";
            }
        } catch (error) {
            alert("Gagal terhubung ke database. Cek koneksi internet Anda.");
        } finally {
            btn.innerText = "Cek Status";
            btn.disabled = false;
        }
    }

    function loopingKonfeti() {
        const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 1100 };
        
        // Interval setiap 500ms agar konfeti terus muncul tanpa henti
        intervalKonfeti = setInterval(function() {
            confetti({
                ...defaults,
                particleCount: 40,
                origin: { x: Math.random(), y: Math.random() - 0.2 }
            });
        }, 500);
    }
</script>
</body>
</html>
