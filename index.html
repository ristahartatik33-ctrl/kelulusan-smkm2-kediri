<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Kelulusan - SMK Muhammadiyah 2 Kediri</title>
    <!-- Library Animasi Konfeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: radial-gradient(circle at top, #0b1f3a, #050d1c); color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        header { 
            display: flex; align-items: center; padding: 10px 5%; 
            background: rgba(14, 34, 63, 0.9); backdrop-filter: blur(10px); 
            position: fixed; top: 0; width: 100%; z-index: 1000; border-bottom: 1px solid #1f3a63; 
        }
        
        .logo-sekolah { height: 50px; margin-right: 15px; }
        
        /* Jarak container ditingkatkan agar tidak mepet header */
        .container { text-align: center; max-width: 600px; width: 100%; margin-top: 150px; }
        
        .badge { display: inline-block; background: #f5b800; color: #000; padding: 5px 15px; border-radius: 20px; font-size: 12px; margin-bottom: 20px; font-weight: bold; }
        
        h1 { font-size: 32px; margin-bottom: 10px; }
        h1 span { color: #f5b800; }
        
        /* Jarak paragraf ke search box diperlebar */
        p { font-size: 16px; color: #aaa; margin-bottom: 45px; }

        .search-box { 
            display: flex; background: #0e223f; border-radius: 10px; 
            overflow: hidden; border: 1px solid #1f3a63; margin-bottom: 40px; 
        }
        .search-box input { flex: 1; padding: 15px; border: none; outline: none; background: transparent; color: #fff; }
        .search-box button { background: #f5b800; border: none; padding: 12px 25px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .search-box button:hover { background: #d4a000; }

        #hasil-pencarian { 
            margin-top: 20px; padding: 30px; border-radius: 15px; 
            background: #162d50; display: none; border: 2px solid #f5b800; 
        }
        
        .foto-siswa { 
            width: 150px; height: 200px; object-fit: cover; 
            border-radius: 10px; border: 3px solid #f5b800; 
            margin: 0 auto 20px auto; display: none; 
        }
        
        footer { margin-top: 50px; font-size: 11px; color: #666; letter-spacing: 1px; }
    </style>
</head>
<body>

<!-- Audio Player disesuaikan ke douten.mp3 -->
<audio id="suaraLulus" src="douten.mp3" preload="auto" loop></audio>

<header>
    <img src="logo%20smk%20muh%202%20HD.png" alt="Logo" class="logo-sekolah">
    <div>
        <div style="font-weight: bold; font-size: 15px; color: #f5b800;">SMK MUHAMMADIYAH 2</div>
        <div style="font-size: 11px; color: #fff;">KOTA KEDIRI</div>
    </div>
</header>

<div class="container">
    <div class="badge">PENGUMUMAN RESMI 2026</div>
    <h1>Portal <span>Kelulusan</span></h1>
    <p>Cari menggunakan nama lengkap atau nama panggilan.</p>

    <div class="search-box">
        <input type="text" id="inputNama" placeholder="Ketik nama di sini...">
        <button onclick="cekStatus()">CEK HASIL</button>
    </div>

    <div id="hasil-pencarian">
        <img id="resFoto" src="" class="foto-siswa">
        <h2 id="resNama" style="color: #f5b800; margin-bottom: 5px;"></h2>
        <p id="resKelas" style="margin-bottom: 15px; color: #ccc;"></p>
        <div id="resStatus" style="font-size: 22px; font-weight: bold; padding: 15px; border-radius: 8px;"></div>
    </div>

    <footer>© 2026 SMK Muhammadiyah 2 Kediri. ABHIA</footer>
</div>

<script>
    let intervalKonfeti;

    async function cekStatus() {
        const namaInput = document.getElementById('inputNama').value;
        const hasilDiv = document.getElementById('hasil-pencarian');
        const fotoImg = document.getElementById('resFoto');
        const audio = document.getElementById('suaraLulus');
        const btn = document.querySelector('.search-box button');
        
        // URL API Terbaru Anda
        const urlAPI = "https://script.google.com/macros/s/AKfycbwn8TT5HZR7gcZyJt8dIPZO-9pnh0BgTVqcI9uZZXvj3wotXeVPYKjbilESybtDsmddUQ/exec"; 

        if(!namaInput) { alert("Masukkan nama!"); return; }

        // Reset Selebrasi & Tampilan
        clearInterval(intervalKonfeti);
        audio.pause(); 
        audio.currentTime = 0;
        hasilDiv.style.display = "none";
        btn.innerText = "Mencari...";
        btn.disabled = true;
        
        try {
            const response = await fetch(`${urlAPI}?nama=${encodeURIComponent(namaInput)}`);
            const data = await response.json();
            
            hasilDiv.style.display = "block";

            if (data.status !== "Tidak Ditemukan") {
                document.getElementById('resNama').innerText = data.namaLengkap;
                document.getElementById('resKelas').innerText = "Kelas: " + data.kelas;
                document.getElementById('resStatus').innerText = data.status;

                // Logika Tampil Foto
                if(data.foto && data.foto.trim() !== "") { 
                    fotoImg.src = data.foto; 
                    fotoImg.style.display = "block"; 
                } else { 
                    fotoImg.style.display = "none"; 
                }

                if(data.status.toUpperCase() === "LULUS") {
                    document.getElementById('resStatus').style.backgroundColor = "#28a745";
                    document.getElementById('resStatus').style.color = "#fff";
                    
                    // Aktifkan Musik & Konfeti Loop
                    loopingKonfeti();
                    audio.play().catch(e => console.log("Autoplay musik diblokir browser, memerlukan interaksi user."));
                } else {
                    document.getElementById('resStatus').style.backgroundColor = "#dc3545";
                    document.getElementById('resStatus').style.color = "#fff";
                }
            } else {
                document.getElementById('resNama').innerText = "Tidak Ditemukan";
                fotoImg.style.display = "none";
                document.getElementById('resKelas').innerText = "Periksa kembali penulisan nama Anda.";
                document.getElementById('resStatus').innerText = "-";
                document.getElementById('resStatus').style.backgroundColor = "transparent";
            }
        } catch (e) { 
            alert("Gagal memuat data. Pastikan koneksi internet aktif."); 
        } finally { 
            btn.innerText = "CEK HASIL"; 
            btn.disabled = false;
        }
    }

    function loopingKonfeti() {
        intervalKonfeti = setInterval(() => {
            confetti({ 
                particleCount: 40, 
                spread: 360, 
                origin: { x: Math.random(), y: Math.random() - 0.2 }, 
                zIndex: 1100 
            });
        }, 500);
    }
</script>
</body>
</html>
